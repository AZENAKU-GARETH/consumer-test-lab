# Render Blueprint — deploy Consumer Test Lab from GitHub
# After committing this, go to render.com → New → Blueprint → choose this repo.
services:
  - type: web
    name: consumer-test-lab
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # This prompts you to paste your Neon Postgres connection string during deploy.
      # Format: postgresql://user:password@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: 20